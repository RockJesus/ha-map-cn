<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;padding:0;background:#123;font-family:system-ui}ha-cn-map-card{display:block}</style>
</head><body>
<script type="module" src="http://localhost:8934/ha-cn-map-card.js"></script>
<script type="module">
const now = Date.now();
const states = {
  'person.rockjesus': { entity_id:'person.rockjesus', state:'not_home', last_updated:new Date(now-4*60000).toISOString(),
    attributes:{ friendly_name:'我', latitude:39.90923, longitude:116.397428 } },
  'person.lulu': { entity_id:'person.lulu', state:'home', last_updated:new Date(now-10*60000).toISOString(),
    attributes:{ friendly_name:'lulu', latitude:39.91723, longitude:116.407428, gps_accuracy: 40 } },
  'device_tracker.car': { entity_id:'device_tracker.car', state:'not_home', last_updated:new Date(now-60000).toISOString(),
    attributes:{ friendly_name:'锐E车', latitude:39.9050, longitude:116.3950, speed: 32 } },
  'zone.home': { entity_id:'zone.home', state:'2', last_updated:new Date(now).toISOString(),
    attributes:{ friendly_name:'我的家', latitude:39.9095, longitude:116.3975, radius:100, passive:false } },
};
const hass = { states, callService:()=>{}, connection:{ subscribeMessage:()=>Promise.resolve(()=>{}) }, config:{latitude:39.9,longitude:116.39} };

function mkCard(cfg) {
  const card = document.createElement('ha-cn-map-card');
  card.setConfig(Object.assign({ type:'custom:ha-cn-map-card', basemap:'amap', show_all:true }, cfg||{}));
  card.hass = hass;
  window.__card = card;
  return card;
}

/* ---- 真实 HA 层级：panel 视图 ----  hui-panel-view(shadow) > hui-card(light) > 卡片 */
window.__mockPanel = (cfg, opts={}) => {
  document.body.innerHTML = '';
  const view = document.createElement('hui-panel-view');
  view.style.cssText = 'display:block;height:100vh;';
  const sr = view.attachShadow({ mode:'open' });
  sr.innerHTML = '<style>:host{display:block;height:100%}</style>';
  const hui = document.createElement('hui-card');
  // 真实 hui-card 是 light DOM 元素，没有自己的高度样式
  hui.style.cssText = opts.giveHeight ? 'display:block;height:100%' : '';
  sr.appendChild(hui);
  const card = mkCard(cfg);
  hui.appendChild(card);
  // hui-card.update() 里的真实行为
  card.layout = 'panel';
  card.isPanel = true;      // 没有 setter 会抛错 → 整卡变错误卡，这里必须不抛
  document.body.appendChild(view);
  window.__parent = hui;
  return card;
};

/* ---- 真实 HA 层级：sections 视图 ---- hui-sections-view(shadow) > hui-grid-section(shadow) > .card(410px) > hui-card > 卡片 */
window.__mockSections = (cfg) => {
  document.body.innerHTML = '';
  const view = document.createElement('hui-sections-view');
  view.style.cssText = 'display:block;height:100vh;overflow:auto;';
  const vsr = view.attachShadow({ mode:'open' });
  const section = document.createElement('hui-grid-section');
  const ssr = section.attachShadow({ mode:'open' });
  ssr.innerHTML = '<style>:host{display:block;padding:8px}</style>';
  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid;grid-template-columns:1fr;gap:8px;';
  const cell = document.createElement('div');
  cell.className = 'card';
  cell.style.cssText = 'position:relative;height:410px;';   // grid 格子固定高度
  const hui = document.createElement('hui-card');
  const card = mkCard(cfg);
  hui.appendChild(card); cell.appendChild(hui); ssr.appendChild(grid); grid.appendChild(cell); vsr.appendChild(section);
  document.body.appendChild(view);
  window.__parent = hui;
  return card;
};
</script></body></html>
