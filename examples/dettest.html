<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;padding:0;background:#123;font-family:system-ui}ha-cn-map-card{display:block}</style>
</head><body>
<script type="module" src="http://localhost:8935/ha-cn-map-card.js"></script>
<script type="module">
const now = Date.now();
const min = 60000;
const states = {
  'person.rockjesus': { entity_id:'person.rockjesus', state:'not_home', last_updated:new Date(now-4*min).toISOString(),
    attributes:{ friendly_name:'我', latitude:39.90923, longitude:116.397428, entity_picture:'https://x/y.jpg' } },
  'person.lulu': { entity_id:'person.lulu', state:'home', last_updated:new Date(now-10*min).toISOString(),
    attributes:{ friendly_name:'lulu', latitude:39.91723, longitude:116.407428 } },
  'device_tracker.car': { entity_id:'device_tracker.car', state:'not_home', last_updated:new Date(now-60000).toISOString(),
    attributes:{ friendly_name:'锐E车', latitude:39.9050, longitude:116.3950, speed: 32 } },
  'zone.home': { entity_id:'zone.home', state:'1', last_updated:new Date(now).toISOString(),
    attributes:{ friendly_name:'我的家', latitude:39.9095, longitude:116.3975, radius:100, passive:false } },
  'zone.company': { entity_id:'zone.company', state:'0', last_updated:new Date(now).toISOString(),
    attributes:{ friendly_name:'公司', latitude:39.98, longitude:116.30, radius:200, passive:false } },
};
const hass = { states, callService:()=>{}, connection:{ subscribeMessage:()=>Promise.resolve(()=>{}) }, config:{latitude:39.9,longitude:116.39} };
// 模拟 history_during_period：8 小时内 8 次状态变化
hass.callWS = async (msg) => {
  if (msg.type !== 'history/history_during_period') throw new Error('unexpected ' + msg.type);
  const out = {};
  for (const id of msg.entity_ids || []) {
    if (id === 'person.rockjesus') {
      out[id] = Array.from({length: 8}, (_, i) => ({
        s: ['home','not_home','company','not_home','home','not_home','home','not_home'][i],
        a: { in_zones: [['zone.home'],[],['zone.company'],[],['zone.home'],[],['zone.home'],[]][i] },
        lu: Math.floor((now - (8-i) * 47*min) / 1000),
      }));
    } else if (id === 'zone.company') {
      // lulu 半小时前进入公司；我 8 小时前离开过
      out['person.lulu'] = [{ s:'not_home', a:{ in_zones: [] }, lu: Math.floor((now-45*min)/1000) },
                            { s:'company',  a:{ in_zones:['zone.company'] }, lu: Math.floor((now-30*min)/1000) }];
      out['person.rockjesus'] = [{ s:'company', a:{ in_zones:['zone.company'] }, lu: Math.floor((now-8*3600000)/1000) },
                                 { s:'not_home', a:{ in_zones:[] }, lu: Math.floor((now-7.5*3600000)/1000) }];
      return out;
    } else out[id] = [];
  }
  return out;
};
window.__hass = hass;

function mkCard(cfg) {
  const card = document.createElement('ha-cn-map-card');
  card.setConfig(Object.assign({ type:'custom:ha-cn-map-card', basemap:'amap', show_all:true }, cfg||{}));
  card.hass = hass;
  window.__card = card;
  return card;
}
window.__mockPanel = (cfg) => {
  document.body.innerHTML = '';
  const view = document.createElement('hui-panel-view');
  view.style.cssText = 'display:block;height:100vh;';
  const sr = view.attachShadow({ mode:'open' });
  const hui = document.createElement('hui-card');
  sr.appendChild(hui);
  const card = mkCard(cfg);
  hui.appendChild(card);
  card.layout = 'panel'; card.isPanel = true;
  document.body.appendChild(view);
  return card;
};
</script></body></html>
