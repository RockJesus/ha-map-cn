# ha-cn-map-card 示例配置

# 示例 1：最简——自动显示所有人 + 家区域
- type: custom:ha-cn-map-card
  title: 家人位置
  show_all: true
  show_zones: true
  height: 380

# 示例 2：高德卫星影像
- type: custom:ha-cn-map-card
  title: 卫星视图
  basemap: amap-satellite
  show_all: true

# 示例 3：天地图矢量（需先去 console.tianditu.gov.cn 申请免费 Key）
- type: custom:ha-cn-map-card
  title: 天地图
  basemap: tianditu
  tianditu_key: 你的天地图Key
  entities:
    - person.me
    - device_tracker.car
  show_zones: true

# 示例 4：固定视野，不自动缩放
- type: custom:ha-cn-map-card
  basemap: amap
  entities:
    - person.me
  fit_entities: false
  default_zoom: 14

# 示例 5：标记状态行（在家 / 离线 / 车速 / 电量），默认开启，可关掉
- type: custom:ha-cn-map-card
  title: 家人位置
  show_all: true
  show_status: true          # 标记下方那行小字；false = 只显示名称
  show_labels: true

# 示例 6：交互对齐官方（聚焦飞行 / 键盘 / 精度圈）
- type: custom:ha-cn-map-card
  title: 家人位置
  show_all: true
  show_accuracy: true        # gps_accuracy 精度圈
  show_status: true          # 标记下方状态行
