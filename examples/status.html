<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>标记状态行 / 离线灰显</title>
<style>body{margin:0;background:#222;font-family:sans-serif;display:flex;gap:16px;padding:16px}#a,#b{width:460px;height:420px}</style>
</head><body>
<div id="a"></div>
<div id="b"></div>
<script type="module" src="../ha-cn-map-card.js?v=092"></script>
<script type="module">
class FakeHaIcon extends HTMLElement { connectedCallback(){ this.textContent="●"; } }
customElements.define("ha-icon", FakeHaIcon);
customElements.define("ha-card", class extends HTMLElement{});
await customElements.whenDefined("ha-cn-map-card");

const states = {
  "person.me": { entity_id:"person.me", state:"home",
    attributes:{ friendly_name:"我", latitude:39.895, longitude:116.36, gps_accuracy:150 }},
  "person.wife": { entity_id:"person.wife", state:"work",
    attributes:{ friendly_name:"家人", latitude:39.915, longitude:116.44 }, last_updated:new Date(Date.now()-8*60000).toISOString()},
  "zone.work": { entity_id:"zone.work", state:"1",
    attributes:{ friendly_name:"公司", latitude:39.915, longitude:116.44, radius:100 }},
  "device_tracker.car": { entity_id:"device_tracker.car", state:"not_home",
    attributes:{ friendly_name:"车", latitude:39.935, longitude:116.385, speed:14.2, gps_accuracy:65 }},
  "device_tracker.phone": { entity_id:"device_tracker.phone", state:"not_home",
    attributes:{ friendly_name:"旧手机", latitude:39.875, longitude:116.335, battery_level:23 }},
  "device_tracker.off": { entity_id:"device_tracker.off", state:"unavailable",
    attributes:{ friendly_name:"失联设备", latitude:39.905, longitude:116.47 }},
  "zone.home": { entity_id:"zone.home", state:"2",
    attributes:{ friendly_name:"家", latitude:39.895, longitude:116.36, radius:80 }},
};
const hass = { states, callService(){}, connection:null };

const mk = (host, cfg) => {
  const c = document.createElement("ha-cn-map-card");
  host.appendChild(c);
  c.setConfig({ type:"custom:ha-cn-map-card", show_all:true, show_zones:true,
    show_cluster:false, hours_to_show:0, height:420, fit_entities:false, default_zoom:11, ...cfg });
  c.hass = hass;
  return c;
};
window.__on  = mk(document.getElementById("a"), { title:"状态行开启（默认）" });
window.__off = mk(document.getElementById("b"), { title:"状态行关闭 show_status:false", show_status:false });
</script>
</body></html>
