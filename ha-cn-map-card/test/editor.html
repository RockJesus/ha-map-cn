<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#111;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#eee}
  #card{width:480px;margin:24px auto 0}
  #editor{width:480px;margin:24px auto;background:#1c1c1e;border-radius:12px;padding:16px;color:#eee}
  h3{margin:0 0 8px;font-size:13px;opacity:.6;font-weight:500;text-align:center}
  #out{width:480px;margin:0 auto 24px;background:#0a0a0a;border-radius:8px;padding:12px;font:11px/1.5 monospace;white-space:pre-wrap;color:#7ee787;min-height:60px}
</style>
</head><body>
<h3>卡片预览</h3>
<div id="card"></div>
<h3>可视化编辑器</h3>
<div id="editor"></div>
<h3>config-changed 回传</h3>
<div id="out">（等待操作…）</div>

<script type="module" src="../dist/ha-cn-map-card.js"></script>
<script type="module">
// ---- 模拟 HA 环境 ----
class FakeIcon extends HTMLElement {
  static get observedAttributes(){return["icon"]}
  connectedCallback(){ this._paint(); }
  attributeChangedCallback(){ this._paint(); }
  _paint(){
    const m = { "mdi:account":"👤", "mdi:cellphone-marker":"📱", "mdi:home":"🏠",
                "mdi:map-marker":"📍", "mdi:car":"🚗", "mdi:map-marker-radius":"📍" };
    this.textContent = m[this.getAttribute("icon")] || "●";
    this.style.fontSize = "16px";
  }
}
customElements.define("ha-icon", FakeIcon);
customElements.define("ha-card", class extends HTMLElement{});

const states = {
  "zone.home":       { entity_id:"zone.home", attributes:{ friendly_name:"我的家", latitude:40.82598, longitude:111.71279, icon:"mdi:home" }},
  "person.rockjesus":{ entity_id:"person.rockjesus", attributes:{ friendly_name:"RockJesus", latitude:39.71015, longitude:116.89539 }},
  "person.lulu":     { entity_id:"person.lulu", attributes:{ friendly_name:"lulu", latitude:40.82557, longitude:111.71354 }},
  "device_tracker.rockjesus": { entity_id:"device_tracker.rockjesus", attributes:{ friendly_name:"RJiPhone", latitude:39.71015, longitude:116.89539, icon:"mdi:map-marker-radius" }},
  "device_tracker.imac": { entity_id:"device_tracker.imac", attributes:{ friendly_name:"iMac", latitude:40.82576, longitude:111.71306 }},
};
const hass = { states, callService:(d,a,o)=>console.log("svc",d,a,o), config:{latitude:40.83,longitude:111.71} };

// ---- 卡片 ----
const card = document.createElement("ha-cn-map-card");
document.getElementById("card").appendChild(card);
const initial = { type:"custom:ha-cn-map-card", title:"家人位置", show_all:true, show_zones:true, height:360, basemap:"amap" };
card.setConfig(initial);
card.hass = hass;
window.__card = card;

// ---- 编辑器 ----
await customElements.whenDefined("ha-cn-map-card-editor");
const ed = document.createElement("ha-cn-map-card-editor");
const out = document.getElementById("out");
let n = 0;
ed.addEventListener("config-changed", (e) => {
  n++;
  out.textContent = `#${n} ` + JSON.stringify(e.detail.config, null, 1);
  window.__lastConfig = e.detail.config;
  // 同步到卡片，验证配置真的能用
  card.setConfig(e.detail.config);
});
document.getElementById("editor").appendChild(ed);
ed.hass = hass;
ed.setConfig(initial);
window.__editor = ed;
console.log("已就绪");
</script>
</body></html>
